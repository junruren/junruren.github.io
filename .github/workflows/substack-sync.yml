# Mirrors new Substack essays into _posts/ so junruren.com remains a complete
# archive and updates stay accessible to a diverse audience.
# See scripts/substack_sync.py for the sync logic and skip rules.
#
# Note: pushes made with the default GITHUB_TOKEN do not trigger other
# workflows, so this workflow explicitly dispatches jekyll.yml after pushing.
name: Sync Substack essays

on:
  schedule:
    - cron: "23 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: substack-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror new Substack posts
        run: python3 scripts/substack_sync.py

      - name: Commit, push, and deploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new posts."
            exit 0
          fi
          git commit -m "blog: mirror new Substack post(s)"
          git push
          gh workflow run jekyll.yml --ref master
